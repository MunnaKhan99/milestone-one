    </header>
    <main>
        <h3>Complete your Registration</h3>
        <form>
            <label for="name">Your Name: 
                <input type="text" placeholder="Your Name">
            </label>

            <label for="Email">Your Email:
                <input type="text" placeholder="Your Email">
            </label>

            <label for="Phone">Your Phone:
                <input type="text" placeholder="Your Phone">
            </label>

            <fieldset>
                <legend>Select Your country</legend>
                <label for="Bangladesh">
                    <input type="radio" name="country" id="Bangladesh">Bangladesh
                </label>

                <label for="India">
                    <input type="radio" name="country" id="India">India
                </label>

                <label for="Pakistan">
                    <input type="radio" name="country" id="Pakistan">Pakistan
                </label>

            </fieldset>

            <fieldset>
                <legend>Select your Knowing Language</legend>
                <label for="Language">
                    <input type="checkbox" name="Language" id="Bangla">Bangla
                </label>

                <label for="Language">
                    <input type="checkbox" name="Language" id="Hindi">Hindi
                </label>

                <label for="Language">
                    <input type="checkbox" name="Language" id="Urdu">Urdu
                </label>
            </fieldset>

            <fieldset>
                <legend>About Your culture</legend>
                <textarea name="" id="" cols="30" rows="5"></textarea>
            </fieldset>
            <input class="reset" type="reset" value="Reset">
            <input type="submit" value="Submit">
         </form>
    </main>
    <footer>

    </footer>
